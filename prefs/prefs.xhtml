<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml">

  <linkset>
    <html:link rel="localization" href="markup-enhancer.ftl"/>
  </linkset>

  <groupbox>
    <label><html:h2 data-l10n-id="markup-enhancer-prefs-highlights"/></label>

    <hbox align="center">
      <label data-l10n-id="markup-enhancer-prefs-palette" flex="1"/>
      <menulist preference="extensions.zotero.markup-enhancer.palette" native="true">
        <menupopup>
          <menuitem value="pastel" label="Pastel"/>
          <menuitem value="neon" label="Neon"/>
          <menuitem value="earthy" label="Earthy"/>
          <menuitem value="default" label="Default (Zotero)"/>
          <menuitem value="custom" label="Custom"/>
        </menupopup>
      </menulist>
    </hbox>
    <description class="zmue-desc" data-l10n-id="markup-enhancer-prefs-palette-desc"/>

    <hbox align="center">
      <html:input type="checkbox" id="zmue-rounded"
                  preference="extensions.zotero.markup-enhancer.roundedCorners"/>
      <label control="zmue-rounded" data-l10n-id="markup-enhancer-prefs-rounded"/>
    </hbox>
    <description class="zmue-desc" data-l10n-id="markup-enhancer-prefs-rounded-desc"/>

    <hbox align="center">
      <label data-l10n-id="markup-enhancer-prefs-radius" flex="1"/>
      <html:input type="number" min="0" max="20" style="width:5em"
                  preference="extensions.zotero.markup-enhancer.cornerRadius"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="markup-enhancer-prefs-custom"/></label>
    <description class="zmue-desc" data-l10n-id="markup-enhancer-prefs-custom-desc"/>
    <hbox align="center">
      <label value="Yellow" flex="1"/>
      <html:input type="color" preference="extensions.zotero.markup-enhancer.customColor.yellow"/>
    </hbox>
    <hbox align="center">
      <label value="Red" flex="1"/>
      <html:input type="color" preference="extensions.zotero.markup-enhancer.customColor.red"/>
    </hbox>
    <hbox align="center">
      <label value="Green" flex="1"/>
      <html:input type="color" preference="extensions.zotero.markup-enhancer.customColor.green"/>
    </hbox>
    <hbox align="center">
      <label value="Blue" flex="1"/>
      <html:input type="color" preference="extensions.zotero.markup-enhancer.customColor.blue"/>
    </hbox>
    <hbox align="center">
      <label value="Purple" flex="1"/>
      <html:input type="color" preference="extensions.zotero.markup-enhancer.customColor.purple"/>
    </hbox>
    <hbox align="center">
      <label value="Magenta" flex="1"/>
      <html:input type="color" preference="extensions.zotero.markup-enhancer.customColor.magenta"/>
    </hbox>
    <hbox align="center">
      <label value="Orange" flex="1"/>
      <html:input type="color" preference="extensions.zotero.markup-enhancer.customColor.orange"/>
    </hbox>
    <hbox align="center">
      <label value="Gray" flex="1"/>
      <html:input type="color" preference="extensions.zotero.markup-enhancer.customColor.gray"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="markup-enhancer-prefs-merge"/></label>
    <hbox align="center">
      <html:input type="checkbox" id="zmue-merge-on"
                  preference="extensions.zotero.markup-enhancer.mergeOverlapping"/>
      <label control="zmue-merge-on" data-l10n-id="markup-enhancer-prefs-merge-on"/>
    </hbox>
    <hbox align="center">
      <html:input type="checkbox" id="zmue-merge-samecolor"
                  preference="extensions.zotero.markup-enhancer.mergeSameColorOnly"/>
      <label control="zmue-merge-samecolor" data-l10n-id="markup-enhancer-prefs-merge-samecolor"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="markup-enhancer-prefs-tags"/></label>
    <hbox align="center">
      <label data-l10n-id="markup-enhancer-prefs-recentcount" flex="1"/>
      <html:input type="number" min="0" max="40" style="width:5em"
                  preference="extensions.zotero.markup-enhancer.recentTagCount"/>
    </hbox>
    <hbox align="center">
      <html:input type="checkbox" id="zmue-tagshortcut-on"
                  preference="extensions.zotero.markup-enhancer.tagShortcutEnabled"/>
      <label control="zmue-tagshortcut-on" data-l10n-id="markup-enhancer-prefs-shortcut-on"/>
    </hbox>
    <hbox align="center">
      <label data-l10n-id="markup-enhancer-prefs-shortcut" flex="1"/>
      <html:input type="text" style="width:9em" id="zmue-shortcut-input"/>
    </hbox>
    <description class="zmue-desc" data-l10n-id="markup-enhancer-prefs-shortcut-desc"/>
  </groupbox>

</vbox>
