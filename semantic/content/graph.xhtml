<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8"/>
  <title>Rete di relazioni</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin:0; height:100%; overflow:hidden;
      font: 13px -apple-system, system-ui, sans-serif;
      background: Canvas; color: CanvasText; }
    #bar { position:absolute; top:0; left:0; right:0; height:38px; display:flex;
      align-items:center; gap:12px; padding:0 12px; box-sizing:border-box;
      border-bottom:1px solid rgba(128,128,128,.35); background:Canvas; z-index:2; }
    #bar input[type=range] { width:130px; vertical-align:middle; }
    #bar .grow { flex:1; }
    #search { padding:4px 8px; border-radius:6px; width:190px;
      border:1px solid rgba(128,128,128,.4); background:Field; color:FieldText; }
    #mode { opacity:.65; font-size:11px; }
    #canvas { position:absolute; top:38px; left:0; right:0; bottom:0; display:block; }
    #tip { position:absolute; pointer-events:none; z-index:3; max-width:320px;
      padding:7px 10px; border-radius:8px; font-size:12px; display:none;
      background:rgba(20,20,20,.94); color:#fff; box-shadow:0 4px 18px rgba(0,0,0,.35); }
    #tip .t { font-weight:600; margin-bottom:3px; }
    #tip .m { opacity:.75; font-size:11px; }
  </style>
</head>
<body>
  <div id="bar">
    <label>Soglia <input type="range" id="thresh" min="0" max="100" value="0"/></label>
    <input type="text" id="search" placeholder="Cerca titolo o tag…"/>
    <span id="mode"></span>
    <span class="grow"></span>
    <button id="reheat">Riordina</button>
  </div>
  <canvas id="canvas"></canvas>
  <div id="tip"></div>

  <script src="graph.js"></script>
</body>
</html>
