<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8"/>
  <title>Rete di relazioni</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin:0; height:100%; overflow:hidden;
      font: 13px -apple-system, system-ui, sans-serif;
      background: Canvas; color: CanvasText; }
    #bar { position:absolute; top:0; left:0; right:0; height:38px; display:flex;
      align-items:center; gap:12px; padding:0 12px; box-sizing:border-box;
      border-bottom:1px solid rgba(128,128,128,.35); background:Canvas; z-index:2; }
    /* One line, always: labels stay beside their controls, controls do not
       shrink, and the status text is the part that gives way. */
    #bar > * { flex:0 0 auto; }
    #bar label { white-space:nowrap; display:flex; align-items:center; gap:6px; }
    #bar input[type=range] { width:110px; }
    #bar .grow { flex:1 1 0; }
    #search { padding:4px 8px; border-radius:6px; width:170px;
      border:1px solid rgba(128,128,128,.4); background:Field; color:FieldText; }
    #lens { max-width:190px; }
    #mode { flex:0 1 auto; min-width:0; opacity:.65; font-size:11px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    /* The stage is a plain div, so left/right/top/bottom really stretch it.
       A canvas is a replaced element: positioned the same way it would NOT
       stretch, its width would stay its intrinsic one -- the bitmap size --
       and sizing the bitmap from the measured width then doubled it every
       frame on a retina screen. The canvas fills the stage; only the stage is
       measured, so its size can never depend on the bitmap. */
    #stage { position:absolute; top:38px; left:0; right:0; bottom:0; overflow:hidden; }
    #canvas { display:block; width:100%; height:100%; }
    #tip { position:absolute; pointer-events:none; z-index:3; max-width:320px;
      padding:7px 10px; border-radius:8px; font-size:12px; display:none;
      background:rgba(20,20,20,.94); color:#fff; box-shadow:0 4px 18px rgba(0,0,0,.35); }
    #tip .t { font-weight:600; margin-bottom:3px; }
    #tip .m { opacity:.75; font-size:11px; }
    #err { position:absolute; top:48px; left:12px; right:12px; z-index:4;
      display:none; white-space:pre-wrap; font-family:ui-monospace, monospace;
      font-size:11px; padding:10px 12px; border-radius:8px;
      background:rgba(150,40,40,.18); border:1px solid rgba(190,70,70,.6); }
  </style>
</head>
<body>
  <div id="bar">
    <label>Soglia <input type="range" id="thresh" min="0" max="100" value="0"/></label>
    <input type="text" id="search" placeholder="Cerca titolo, tag o concetto…"/>
    <label>Lente <select id="lens"><option value="">nessuna</option></select></label>
    <span id="mode"></span>
    <span class="grow"></span>
    <button id="reheat">Riordina</button>
  </div>
  <div id="stage"><canvas id="canvas"></canvas></div>
  <div id="tip"></div>
  <div id="err"></div>

  <script src="graph.js"></script>
</body>
</html>
