<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml">

  <!-- Deliberately no <linkset> and no data-l10n-id anywhere: every label here
       is literal text. An l10n id that fails to resolve renders blank, and in
       Zotero 10 an unresolved id in a menu can break the whole context menu, so
       this pane depends on no localisation at all. -->

  <groupbox>
    <label><html:h2>Comandi</html:h2></label>
    <description class="zsem-desc">Seleziona prima gli elementi nella finestra principale di Zotero, poi usa questi pulsanti.</description>
    <hbox align="center" style="gap:8px; flex-wrap:wrap">
      <button label="Imposta API key Gemini…"
              oncommand="Zotero.Semantic.uiSetKey()"/>
      <button label="Verifica provider AI…"
              oncommand="Zotero.Semantic.uiVerify()"/>
    </hbox>
    <hbox align="center" style="gap:8px; flex-wrap:wrap">
      <button label="Suggerisci tag per gli elementi selezionati…"
              oncommand="Zotero.Semantic.uiTagSelected()"/>
      <button label="Mostra rete di relazioni…"
              oncommand="Zotero.Semantic.uiGraph()"/>
    </hbox>
    <hbox align="center" style="gap:8px; flex-wrap:wrap">
      <button label="Cerca per argomento (lista per pertinenza)…"
              oncommand="Zotero.Semantic.uiSearch()"/>
    </hbox>
    <hbox align="center" style="gap:8px; flex-wrap:wrap">
      <button label="Analizza concetti degli elementi selezionati…"
              oncommand="Zotero.Semantic.uiAnalyzeConcepts()"/>
      <button label="Ordina la biblioteca per concetto…"
              oncommand="Zotero.Semantic.uiRankByConcept()"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2>Concetti</html:h2></label>
    <description class="zsem-desc">Per ogni documento il modello elenca i concetti trattati; poi gli embedding misurano, brano per brano dall'inizio alla fine del testo (più le tue evidenziazioni), quanta parte del documento è dedicata a ciascuno. Il risultato compare nella sezione «Concetti» del pannello laterale, nelle colonne «Pertinenza» e «Concetti» della lista (da attivare con il tasto destro sull'intestazione delle colonne) e nella lente della rete di relazioni.</description>
    <description class="zsem-desc">I dati sono salvati in note automatiche nella collezione «Zotero Semantic (dati)», così la sincronizzazione di Zotero li porta sugli altri computer. Non modificarle; se le elimini, basta rianalizzare i documenti.</description>
    <hbox align="center">
      <label value="Numero massimo di concetti per documento" flex="1"/>
      <html:input type="number" min="4" max="25" style="width:5em"
                  preference="extensions.zotero.semantic.conceptsMax"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2>Motore AI</html:h2></label>
    <hbox align="center">
      <label value="Provider" flex="1"/>
      <menulist preference="extensions.zotero.semantic.provider" native="true">
        <menupopup>
          <menuitem value="gemini" label="Gemini (API, richiede key)"/>
          <menuitem value="apple" label="Apple on-device (macOS)"/>
        </menupopup>
      </menulist>
    </hbox>
    <description class="zsem-desc">Gemini funziona su qualsiasi sistema ma invia i dati a Google. Apple on-device elabora tutto sul Mac, senza rete e senza costi, ma richiede una CLI dei Foundation Models (macOS 27 include /usr/bin/fm).</description>
  </groupbox>

  <groupbox>
    <label><html:h2>Gemini</html:h2></label>
    <hbox align="center">
      <label value="API key" flex="1"/>
      <html:input type="password" style="width:20em"
                  preference="extensions.zotero.semantic.geminiKey"/>
    </hbox>
    <description class="zsem-desc">Se il campo non salva, usa il pulsante "Imposta API key Gemini…" qui sopra. La chiave è salvata in chiaro nelle preferenze di Zotero, come tutte le preferenze.</description>
    <hbox align="center">
      <label value="Modello per i tag" flex="1"/>
      <html:input type="text" style="width:14em"
                  preference="extensions.zotero.semantic.geminiModel"/>
    </hbox>
    <hbox align="center">
      <label value="Modello per gli embedding" flex="1"/>
      <html:input type="text" style="width:14em"
                  preference="extensions.zotero.semantic.geminiEmbedModel"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2>Motore di embedding</html:h2></label>
    <description class="zsem-desc">Gli embedding sono i vettori che danno le distanze nella rete di relazioni e l'ordine nella ricerca per argomento. Si scelgono separatamente dal motore dei tag: così puoi taggare in locale con Apple e avere comunque grafo e ricerca.</description>
    <hbox align="center">
      <label value="Provider" flex="1"/>
      <menulist preference="extensions.zotero.semantic.embedProvider" native="true">
        <menupopup>
          <menuitem value="gemini" label="Gemini (usa la key qui sopra)"/>
          <menuitem value="nvidia" label="NVIDIA NIM (nemotron, key gratuita)"/>
        </menupopup>
      </menulist>
    </hbox>
    <hbox align="center">
      <label value="API key NVIDIA" flex="1"/>
      <html:input type="password" style="width:20em"
                  preference="extensions.zotero.semantic.nvidiaKey"/>
    </hbox>
    <hbox align="center">
      <label value="Modello NVIDIA" flex="1"/>
      <html:input type="text" style="width:20em"
                  preference="extensions.zotero.semantic.nvidiaEmbedModel"/>
    </hbox>
    <hbox align="center">
      <label value="Endpoint NVIDIA" flex="1"/>
      <html:input type="text" style="width:20em"
                  preference="extensions.zotero.semantic.nvidiaBase"/>
    </hbox>
    <description class="zsem-desc">La key gratuita si ottiene su build.nvidia.com. nemotron-3-embed-1b produce vettori a 2048 dimensioni, più fini di quelli di Gemini. Cambiando motore o modello la cache dei vettori viene ricalcolata: vettori di modelli diversi non sono confrontabili tra loro.</description>
  </groupbox>

  <groupbox>
    <label><html:h2>Apple on-device</html:h2></label>
    <description class="zsem-desc">Su macOS 27 il comando predefinito è già pronto. Su macOS 26 /usr/bin/fm non esiste: indica il percorso di una CLI di terze parti. Nel modello {cli}, {prompt}, {schema} e {out} vengono sostituiti con percorsi reali.</description>
    <hbox align="center">
      <label value="Percorso della CLI" flex="1"/>
      <html:input type="text" style="width:16em"
                  preference="extensions.zotero.semantic.appleCli"/>
    </hbox>
    <hbox align="center">
      <label value="Modello di comando" flex="1"/>
      <html:input type="text" style="width:26em"
                  preference="extensions.zotero.semantic.appleTemplate"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2>Tag</html:h2></label>
    <hbox align="center">
      <label value="Numero massimo di tag proposti" flex="1"/>
      <html:input type="number" min="1" max="20" style="width:5em"
                  preference="extensions.zotero.semantic.maxTags"/>
    </hbox>
    <hbox align="center">
      <html:input type="checkbox" id="zsem-reuse"
                  preference="extensions.zotero.semantic.reuseVocabulary"/>
      <label control="zsem-reuse" value="Riusa i tag già presenti in biblioteca quando possibile"/>
    </hbox>
    <hbox align="center">
      <label value="Caratteri inviati al modello per documento" flex="1"/>
      <html:input type="number" min="2000" max="60000" step="1000" style="width:7em"
                  preference="extensions.zotero.semantic.profileMaxChars"/>
    </hbox>
    <description class="zsem-desc">Il profilo inviato contiene metadati, le tue evidenziazioni e estratti del testo presi da tutto il documento (inizio, punti intermedi e fine). Alzando questo valore il modello vede più testo e propone tag più precisi, al costo di richieste più lente e più costose. Un libro costa quanto un articolo: viene campionato, non inviato per intero.</description>
  </groupbox>

  <groupbox>
    <label><html:h2>Rete di relazioni</html:h2></label>
    <hbox align="center">
      <html:input type="checkbox" id="zsem-emb"
                  preference="extensions.zotero.semantic.embeddings"/>
      <label control="zsem-emb" value="Usa gli embedding per le distanze semantiche"/>
    </hbox>
    <description class="zsem-desc">Con gli embedding due documenti risultano vicini anche senza tag in comune. Richiede una key per il motore di embedding scelto qui sopra; senza, si usano soltanto tag, autori e collezioni. I vettori sono messi in cache su disco, quindi si pagano una sola volta. Gli stessi vettori alimentano la ricerca per argomento.</description>
    <hbox align="center">
      <label value="Numero massimo di documenti nel grafo" flex="1"/>
      <html:input type="number" min="10" max="2000" style="width:6em"
                  preference="extensions.zotero.semantic.graphMaxNodes"/>
    </hbox>
    <hbox align="center">
      <label value="Soglia minima di collegamento (%)" flex="1"/>
      <html:input type="number" min="0" max="100" style="width:5em"
                  preference="extensions.zotero.semantic.graphMinWeightPct"/>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2>Avanzate</html:h2></label>
    <hbox align="center">
      <html:input type="checkbox" id="zsem-ctxmenu"
                  preference="extensions.zotero.semantic.enableContextMenu"/>
      <label control="zsem-ctxmenu" value="Aggiungi i comandi al menu con il tasto destro (sperimentale)"/>
    </hbox>
    <description class="zsem-desc">Disattivato di proposito: su Zotero 10 le voci di menu dei plugin possono avere solo etichette localizzate, e un'etichetta non risolta compare vuota e può bloccare il menu contestuale di Zotero. Riattivalo solo per provarlo; richiede il riavvio di Zotero.</description>
  </groupbox>

</vbox>
